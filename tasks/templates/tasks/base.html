{% if messages %}
    {% for message in messages %}
        <div class="alert">{{ message }}</div>
    {% endfor %}
{% endif %}

<nav>
    <a href="{% url 'task_search'%}">Home</a>
    {% if user.is_authenticated%}
        <a href="{% url 'user_logout' %}">Logout</a>
    {% else %}
        <a href="{% url 'user_login' %}">Login</a>
    {% endif %}
</nav>

<div class="content">
    {% block content %}{% endblock %}
</div>
