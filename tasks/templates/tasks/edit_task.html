<h2>Edit Tasks</h2>

<form method="POST" action="{% url 'edit_task' task.id%}" novalidate>
  {% csrf_token %} 
  
  {% if form.errors %}
  <div class="error-message">{{ form.errors }}</div>
  {% endif %} 
  
  {{ form.as_p }}

  <button type="submit">Save Changes</button>
  <a href="{% url 'task_search' %}">Cancel</a>
</form>
